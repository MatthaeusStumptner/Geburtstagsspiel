name: Validate and publish editor content

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - src/data/levels/*.level.json

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  validate-and-publish:
    if: startsWith(github.head_ref, 'publisher/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted publishing guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Verify publisher identity and changed paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_BOT_LOGIN: ${{ vars.PUBLISHER_BOT_LOGIN }}
        run: node scripts/validate-publish-pr.mjs

      - name: Check out proposed level data
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - run: npm test
      - run: npm run build

      - name: Publish after all checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash --delete-branch

      - name: Start GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
