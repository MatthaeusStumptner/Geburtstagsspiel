name: Verify foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the unified foundation gate
        run: npm run verify
      - name: Upload renderer browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-browser-artifacts
          path: |
            packages/pixel-renderer/output/playwright/renderer
          if-no-files-found: error
      - name: Upload game browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-browser-artifacts
          path: |
            apps/game/output/playwright/game
          if-no-files-found: error
      - name: Upload studio browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-artifacts
          path: |
            apps/studio/test-results
            apps/studio/output/playwright
          if-no-files-found: error
