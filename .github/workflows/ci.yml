name: Test game

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload browser regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-game-regression
          path: output/playwright/game
          if-no-files-found: ignore
