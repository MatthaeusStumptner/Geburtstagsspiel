<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071522" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./src/assets/silkscreen-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/assets/silkscreen-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="description"
      content="Franz &amp; Lola – ein liebevoller Pixel-Art Maze-Chase an neun Orten in Passau."
    />
    <title>Franz &amp; Lola – Gassi-Runde Passau</title>
  </head>
  <body data-min-save-version="2" data-save-version="9">
    <script data-initial-layout-bootstrap>
      (() => {
        let initialClass = 'map-active';
        try {
          const saved = JSON.parse(localStorage.getItem('gassi-runde-hals-save') || 'null');
          const minSaveVersion = Number(document.body.dataset.minSaveVersion);
          const saveVersion = Number(document.body.dataset.saveVersion);
          const supported = saved
            && typeof saved === 'object'
            && !Array.isArray(saved)
            && Number.isInteger(saved.version)
            && saved.version >= minSaveVersion
            && saved.version <= saveVersion;
          if (supported && saved.mode !== 'map') initialClass = 'mobile-game-active';
        } catch {
          initialClass = 'map-active';
        }
        if (initialClass) document.body.classList.add(initialClass);
      })();
    </script>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Gassi-Runde Passau">
          <p class="eyebrow" data-i18n="eyebrow">EIN KLEINES ABENTEUER AUS PASSAU</p>
          <div class="brand-line">
            <h1>GASSI-RUNDE</h1>
            <span>PASSAU</span>
          </div>
        </div>

        <div id="svelte-top-hud"></div>
      </header>

      <section class="game-layout">
        <div class="board-column">
          <div id="svelte-board-hud"></div>
          <div class="board-frame">
            <div id="svelte-location-ribbon"></div>
            <canvas
              id="game"
              width="600"
              height="600"
              role="img"
              aria-label="Spielfeld der Gassi-Runde durch Hals"
            ></canvas>
            <div class="cat-radar" id="cat-radar" hidden aria-hidden="true"></div>
            <div id="svelte-level-overlays"></div>
            <div id="svelte-map-screen"></div>
            <div id="svelte-game-overlay"></div>
          </div>

        </div>

        <div id="svelte-side-panel"></div>
      </section>

      <footer>
        <span data-i18n="footerPlace">PASSAU · STADT &amp; FLÜSSE</span>
        <span data-i18n="footerTagline">PIXEL FÜR PIXEL DURCH DIE NACHT</span>
        <span id="app-version">__APP_VERSION__</span>
      </footer>
    </main>

    <div id="svelte-ui"></div>
    <div id="svelte-scene-transition"></div>

    <div class="sr-only" id="announcement" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
